  },
  sizeConfirm(){ const p = state.ui.popover; const n = A.addLines(p.articleId, [...p.picked], true); state.ui.popover = null; render(); A.toast(`Added ${plural(n,'size')}`); },

  /* Option B — drawer */
  setLineMode(m){ state.ui.lineMode = m; state.ui.drawer = null; state.ui.popover = null; render(); A.toast(m === 'B' ? 'Option B: click a size row to open the drawer' : 'Option A: inline controls and popovers', true); },
  rowOpen(e, lineId, focus){
    if (e && e.target.closest('.p-checkbox, .p-selectbutton, .p-select, select, input, textarea, button, label, .ph')) return;
    const l = drawerLines().find(x => x.id === lineId);
    state.ui.popover = null; state.ui.drawer = {lineId, buf:mkBuf(l)}; render();
    if (focus === 'photos') document.querySelector('.p-drawer .dr-add')?.scrollIntoView({block:'nearest'});
    else if (focus === 'note') document.getElementById('dr-bnote')?.focus({preventScroll:true});
    else if (!e || !e.target.closest('.qty-in')) document.getElementById('dr-qty')?.focus({preventScroll:true});
  },
  drLine(){ return drawerLines().find(l => l.id === state.ui.drawer.lineId); },
  drSet(k, v, quiet){ state.ui.drawer.buf[k] = v; if (!quiet) render(); },
  drDecide(v){ const b = state.ui.drawer.buf; b.decision = b.decision === v ? null : v; render(); },
  drRemovePhoto(k){ state.ui.drawer.buf.photos.splice(k, 1); render(); },
  drSample(){ const b = state.ui.drawer.buf; b.photos.push([P1, P2, P3][b.photos.length % 3]); render(); },
  drFiles(files){ const b = state.ui.drawer.buf; [...files].forEach(f => { const fr = new FileReader(); fr.onload = () => { b.photos.push(fr.result); render(); }; fr.readAsDataURL(f); }); },
  // Commit the buffer to the size line
  drCommit(){ const dr = state.ui.drawer; if (!dr || !dr.buf) return; const l = A.drLine(); if (!l) return;
    const b = dr.buf; if (state.view.name === 'create') Object.assign(l, {qty:b.qty, reasonId:b.reasonId, photos:[...b.photos], note:(b.note || '').trim()});
    else if (b.editable) Object.assign(l, {decision:b.decision, brandNote:(b.brandNote || '').trim()}); },
  drSave(next){ const lbl = sizeOf(articleById(A.drLine().articleId), A.drLine().sizeKey).label; A.drCommit();
    if (next){ A.drawerNav(1, true); A.toast(`${lbl} saved`); } else { state.ui.drawer = null; render(); A.toast(`${lbl} saved`); } },
  count(el){ const c = document.getElementById(el.id + '-count'); if (c) c.textContent = `${el.value.length}/300`; },
  // ‹ › keep what was typed (assumption: arrows move on without losing edits); Cancel / ✕ discard
  drawerNav(dir, committed){
    const ls = drawerLines(); if (ls.length < 2) return;
    if (!committed) A.drCommit();
    const i = ls.findIndex(l => l.id === state.ui.drawer.lineId);
    const j = (i + dir + ls.length) % ls.length;
    state.ui.drawer = {lineId:ls[j].id, buf:mkBuf(ls[j])}; render();
    document.querySelector('.p-drawer-content')?.scrollTo?.(0, 0);
    if (dir > 0 && j === 0) A.toast('Back to the first size', true);
  },
  closeDrawer(){ state.ui.drawer = null; render(); },
  drRemoveLine(){
    const d = state.draft, i = d.lines.findIndex(l => l.id === state.ui.drawer.lineId), l = d.lines[i];
    const label = sizeOf(articleById(l.articleId), l.sizeKey).label;
    d.lines.splice(i, 1);
    const next = d.lines[i] || d.lines[i - 1];
    state.ui.drawer = next ? {lineId:next.id} : null; render();
    A.toast(`Removed ${label}`);
  },

  /* notes */
  openNote(target){
    if (target === 'decision'){ state.ui.drawer = null; state.ui.noteDrawer = {text:returnById(state.view.id).decisionNote || ''}; render(); document.getElementById('nd-text')?.focus(); return; }
    if (target === 'draft'){ state.ui.drawer = null; state.ui.noteDrawer = {text:state.draft.note || ''}; render(); document.getElementById('nd-text')?.focus(); return; }
    const text = returnById(state.view.id).decisionNote;
    state.ui.modal = {type:'note', target, text}; render(); document.getElementById('note-text')?.focus();
  },
  modalVal(k, v){ state.ui.modal[k] = v; },
  setDecisionNote(v){ returnById(state.view.id).decisionNote = v; },
  noteDrawerVal(v){ state.ui.noteDrawer.text = v; },
  closeNoteDrawer(){ state.ui.noteDrawer = null; render(); },
  saveNoteDrawer(){
    const t = (state.ui.noteDrawer.text || '').trim();
    if (state.view.name === 'create'){ state.draft.note = t; state.ui.noteDrawer = null; render(); A.toast(t ? 'Note saved — sent with your request' : 'Note removed'); return; }
    returnById(state.view.id).decisionNote = t; state.ui.noteDrawer = null; render(); A.toast(t ? 'Note saved — sent with your decision' : 'Note removed'); },
  saveNote(){
    const m = state.ui.modal, t = (m.text || '').trim();
    if (m.target === 'draft') state.draft.note = t; else returnById(state.view.id).decisionNote = t;
    state.ui.modal = null; render(); A.toast(t ? 'Note saved' : 'Note removed');
  },

  /* brand review */
  decide(lineId, dec){
    const r = returnById(state.view.id); const l = r.lines.find(x => x.id === lineId);
    l.decision = l.decision === dec ? null : dec; render();
  },
  decideAll(articleId, dec){
    const r = returnById(state.view.id), ls = r.lines.filter(l => !articleId || l.articleId === articleId);
    if (ls.every(l => l.decision === dec)){ ls.forEach(l => { l.decision = null; }); render(); A.toast('Decisions cleared', true); return; }
    ls.forEach(l => { l.decision = dec; }); render();
    A.toast(`${dec === 'authorized' ? 'Authorized' : 'Declined'} ${plural(ls.length,'size')}${articleId ? ' of ' + articleById(articleId).name : ''} — change any size in its row`);
  },
  bulkDecide(dec){
    const r = returnById(state.view.id); let n = 0;
    r.lines.forEach(l => { if (state.ui.sel.has(l.id)){ l.decision = dec; n++; } });
    state.ui.sel.clear(); render(); A.toast(`${dec === 'authorized' ? 'Authorized' : 'Declined'} ${plural(n,'size')}`);
  },
  openLineNote(lineId){ const l = returnById(state.view.id).lines.find(x => x.id === lineId); state.ui.popover = {type:'linenote', lineId, anchor:'bn-' + lineId, note:l.brandNote}; render(); document.getElementById('pop-note')?.focus(); },
  showLineNote(lineId){ const l = returnById(state.view.id).lines.find(x => x.id === lineId); A.toast(l.brandNote ? `Note to retailer: ${l.brandNote}` : 'No note on this size'); },
  lineNoteSave(){ const p = state.ui.popover; returnById(state.view.id).lines.find(x => x.id === p.lineId).brandNote = p.note.trim(); state.ui.popover = null; render(); },
  submitDecision(){
    const r = returnById(state.view.id); if (r.lines.some(l => !l.decision)) return;
    r.decisionNote = (r.decisionNote || '').trim();
    r.submitted = true; r.submittedAt = todayIso();
    // Back to Returns Management, where the request now shows its final status
    state.list.kpi = 'all'; state.list.page = 1; A.go('list');
    A.toast(`${r.id} submitted — ${STATUS[deriveStatus(r)].label}. ${retailerById(r.retailerId).name} is notified.`);
  },

  /* misc */
  showPolicy(brandId){ state.ui.modal = {type:'policy', brandId}; render(); },
  lightbox(src){ state.ui.modal = {type:'lightbox', src}; render(); },
  closeModal(){ state.ui.modal = null; render(); },
  exportReturn(id){
    const r = returnById(id), b = brandById(r.brandId), ret = retailerById(r.retailerId);
    const q = v => { v = String(v ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    const head = ['return_id','status','brand','retailer','store','reference','packages','created_by','created_at','ean','article_number','article_name','size','qty','reason','photos','retailer_line_note','decision','brand_line_note'];
    const rows = r.lines.map(l => { const a = articleById(l.articleId), s = sizeOf(a, l.sizeKey);
      return [r.id, deriveStatus(r), b.name, ret.name, r.store, r.reference, r.packages, r.createdBy.name, r.createdAt, s.ean, a.number, a.name, s.label, l.qty, reasonLabel(b, l.reasonId), l.photos.length, l.note, r.submitted ? l.decision : '', r.submitted ? l.brandNote : ''].map(q).join(','); });
    state.ui.modal = {type:'export', id, csv:[head.join(','), ...rows].join('\n')}; render();
  },
  copyCsv(){
    const ta = document.getElementById('csv');
    navigator.clipboard?.writeText(ta.value).then(() => A.toast('Copied to clipboard'), () => { ta.select(); A.toast('Press ⌘C / Ctrl+C to copy'); }) ?? (ta.select(), A.toast('Press ⌘C / Ctrl+C to copy'));
  },

  /* settings */
  openSettings(){ const b = brandById(state.brandAccountId); state.ui.modal = {type:'settings', data:JSON.parse(JSON.stringify(b))}; render(); },
  setS(k, v, quiet){ state.ui.modal.data[k] = v; if (!quiet) render(); },
  setPolicyMode(mode){ state.ui.modal.data.policy.mode = mode; render(); },
  setPolicyText(v){ state.ui.modal.data.policy.text = v; },
  setPdf(name){ state.ui.modal.data.policy.pdfName = name; render(); },
  setReasonFlag(i, k){ const r = state.ui.modal.data.reasons[i]; r[k] = !r[k]; render(); },
  setReasonLabel(i, v){ state.ui.modal.data.reasons[i].label = v; },
  removeReason(i){ state.ui.modal.data.reasons.splice(i, 1); render(); },
  addReason(){ const rs = state.ui.modal.data.reasons; const i = rs.findIndex(r => r.isOther); rs.splice(i < 0 ? rs.length : i, 0, {id:'c' + Date.now(), label:'', photoRequired:false, active:true, isOther:false, custom:true}); render(); document.getElementById(`rs-lbl-${i < 0 ? rs.length - 1 : i}`)?.focus(); },
  saveSettings(){
    const s = state.ui.modal.data; const b = brandById(state.brandAccountId);
    s.reasons = s.reasons.filter(r => !r.custom || r.label.trim()).map(r => ({...r, label:r.label.trim() || (r.isOther ? 'Other' : r.label)}));
    s.minPieces = Math.max(1, parseInt(s.minPieces, 10) || 1);
    Object.assign(b, {reviewLocation:s.reviewLocation, policy:s.policy, minEnabled:s.minEnabled, minPieces:s.minPieces, reasons:s.reasons});
    state.ui.modal = null; render(); A.toast(`Settings saved for ${b.name}`);
  },

  /* scenarios */
  scenario(key){
    if (!key) return;
    const spec = state.ui.spec, lm = state.ui.lineMode; state = freshState(); state.ui.spec = spec; state.ui.lineMode = lm;
    const retailerCreate = (brandId, fill) => { state.role = 'retailer'; state.lastBrand = brandId; A.newReturn(); state.draft.packages = '1'; fill(state.draft); };
    const set = (aid, key, qty, reason, o = {}) => { A.addLines(aid, [key]); const l = state.draft.lines.find(x => x.articleId === aid && x.sizeKey === key); Object.assign(l, {qty:String(qty), reasonId:reason}, o); };
    switch (key){
      case 'happy': retailerCreate('mustang', () => { set('m-tr','W28-L30',10,'fit'); set('m-tr','W29-L30',6,'fit'); set('m-ct','M',5,'defect',{photos:[P1],note:'Print peeling'}); state.draft.reference = 'RT-9001'; }); break;
      case 'below': retailerCreate('mustang', () => { set('m-tr','W28-L30',2,'fit'); set('m-tr','W29-L30',6,'fit'); }); state.ui.showIssues = true; break;
      case 'photo': retailerCreate('sa', () => { set('sa-pj','S',5,'defect'); set('sa-pj','M',5,'fit'); }); state.ui.showIssues = true; break;
      case 'inprogress': state.role = 'brand'; state.brandAccountId = 'mustang'; A.open('RET - 2042'); break;
      case 'partial': state.role = 'retailer'; state.list.kpi = 'partial'; A.open('RET - 2038'); break;
      case 'behalf': state.role = 'brand'; state.brandAccountId = 'mustang'; A.newReturn(); state.draft.retailerId = 'br'; state.draft.store = 'Stuttgart store'; set('m-dj','M',10,'wrong'); break;
      case 'own': state.role = 'brand'; state.brandAccountId = 'fb'; A.open('RET - 2035'); break;
      case 'b-create': state.ui.lineMode = 'B'; retailerCreate('sa', () => { set('sa-pj','S',6,'defect',{photos:[P1,P2],note:'Zip broken at the back'}); set('sa-pj','M',6,'fit'); set('sa-pj','L','',''); }); state.ui.drawer = {lineId:state.draft.lines[2].id, buf:mkBuf(state.draft.lines[2])}; break;
      case 'b-review': state.ui.lineMode = 'B'; state.role = 'brand'; state.brandAccountId = 'mustang'; A.open('RET - 2042'); state.ui.drawer = {lineId:returnById('RET - 2042').lines[3].id, buf:mkBuf(returnById('RET - 2042').lines[3])}; break;
      case 'sizes': retailerCreate('mustang', () => { set('m-tr','W28-L30',20,'defect'); }); state.ui.sizeDrawer = {articleId:'m-tr', tab:'specific', qty:{'W29-L30':'10','W30-L30':'5'}, allQty:''}; break;
      case 'discard': retailerCreate('sa', () => { set('sa-pj','S','',''); }); state.ui.modal = {type:'discard'}; break;
      case 'r-note': retailerCreate('mustang', () => { set('m-tr','W28-L30',20,'fit'); }); A.openNote('draft'); break;
      case 'multi': retailerCreate('mustang', () => {}); { const c = state.catalog.mustang; state.ui.searchQ = [c[0].sizes[0].ean, c[0].sizes[1].ean, c[3].sizes[2].ean, '4062999000011'].join(', '); state.ui.searchOpen = true; } break;
      case 'b-note': state.role = 'brand'; state.brandAccountId = 'mustang'; A.open('RET - 2042'); A.openNote('decision'); break;
      case 'empty-r': state.role = 'retailer'; state.returns = state.returns.filter(r => r.retailerId !== 'pc'); A.go('list'); break;
      case 'empty-b': state.role = 'brand'; state.brandAccountId = 'fb'; state.returns = state.returns.filter(r => r.brandId !== 'fb'); A.go('list'); break;
      case 'off-access': case 'off-enable': state.role = 'brand'; state.brandAccountId = 'fb'; state.returns = state.returns.filter(r => r.brandId !== 'fb'); state.ui.notEnabled = key === 'off-access' ? 'access' : 'enable'; A.go('list'); break;
    }
    render();
    A.toast('Scenario loaded');
  },
};
window.A = A;

/* ---------- global listeners ---------- */
let closeRender = false;
document.addEventListener('click', e => {
  const u = state.ui;
  if (u.selOpen && !e.target.closest('.p-select') && !e.target.closest('#sel-overlay')){ u.selOpen = null; closeRender = true; }
  if (u.popover && !e.target.closest('#pop') && !e.target.closest('[data-anchor]')){ u.popover = null; closeRender = true; }
  if (u.searchOpen && !e.target.closest('.art-search')){ u.searchOpen = false; closeRender = true; }
}, true);
document.addEventListener('click', () => { if (closeRender){ closeRender = false; render(); } });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (state.ui.modal){ A.closeModal(); } else if (state.ui.popover){ A.closePop(); } else if (state.ui.sizeDrawer){ A.closeSizes(); } else if (state.ui.noteDrawer){ A.closeNoteDrawer(); } else if (state.ui.drawer){ A.closeDrawer(); }
});
window.addEventListener('resize', placePopover);
// Quantity fields (PrimeNG input-number renders a text input with a numeric keyboard): whole numbers only, typed or pasted
document.addEventListener('keydown', e => { if (e.target.matches?.('input[inputmode=numeric]') && e.key.length === 1 && !/[0-9]/.test(e.key) && !e.ctrlKey && !e.metaKey) e.preventDefault(); }, true);
document.addEventListener('input', e => { const t = e.target; if (t.matches?.('input[inputmode=numeric]') && /[^0-9]/.test(t.value)){ const pos = t.selectionStart - (t.value.slice(0, t.selectionStart).match(/[^0-9]/g) || []).length; t.value = t.value.replace(/[^0-9]/g, ''); t.setSelectionRange(pos, pos); } }, true);
const tip = document.getElementById('spec-tip');
document.addEventListener('mousemove', e => {
  if (!state.ui.spec){ tip.style.display = 'none'; return; }
  const el = e.target.closest && e.target.closest('[data-fr],[data-fcp]');
  if (!el){ tip.style.display = 'none'; return; }
  const comp = e.target.closest('[data-fcp]'), fr = e.target.closest('[data-fr]');
  tip.innerHTML = (comp ? `<b>${esc(comp.dataset.fcp)}</b>` : '') + (comp && fr ? '<br>' : '') + (fr ? esc(fr.dataset.fr) : ''); tip.style.display = 'block';
  tip.style.left = Math.min(e.clientX + 14, innerWidth - 330) + 'px'; tip.style.top = (e.clientY + 16) + 'px';
});

// Retailer-only build: the brand side isn't reachable
A.setRole = () => {}; A.startAs = () => {}; A.setBrandAccount = () => {};
render();
</script>

</body></html>
